# Образ с фиксированным тегом (без :latest) для воспроизводимости.
services:
  postgres:
    image: postgres:16.8-bookworm
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: app_user
      POSTGRES_DB: app_database
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../db/backups:/backups
    secrets:
      - postgres_password
    networks:
      - db_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d app_database"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "5433:5432"  # Доступ с хоста (5433 чтобы избежать конфликта с локальным PostgreSQL)

  # Тестовые данные. Не запускаются при `up` — только отдельной командой,
  # после того как backend применил миграции:
  #   docker compose -f compose.db.yml --profile seed run --rm db-seed
  # Повторный запуск пересоздаёт тестовые данные; справочники и администратор не затрагиваются.
  db-seed:
    image: postgres:16.8-bookworm
    profiles: [ "seed" ]
    restart: "no"
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - "export PGPASSWORD=$$(cat /run/secrets/postgres_password | tr -d '\\r\\n'); exec psql -h postgres -U app_user -d app_database -v ON_ERROR_STOP=1 -f /seed/99_seed_test_data.sql"
    volumes:
      - ../db/test_data/99_seed_test_data.sql:/seed/99_seed_test_data.sql:ro
    secrets:
      - postgres_password
    networks:
      - db_network
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

networks:
  db_network:
    driver: bridge

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt