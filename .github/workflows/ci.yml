name: CI

on:
  push:
    branches: [main, developer]
  pull_request:
    branches: [main, developer]

jobs:
  build-and-test-backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore backend/AcademicTopicSelectionService.slnx

      - name: Build
        run: dotnet build backend/AcademicTopicSelectionService.slnx --no-restore -c Release

      - name: Check EF Core migrations are up to date
        working-directory: backend
        # Падает, если модель EF изменили, а миграцию для одного из провайдеров не добавили.
        # dotnet ef использует ApplicationDbContextDesignTimeFactory: приложение и секреты не нужны.
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes \
            -p src/AcademicTopicSelectionService.Migrations.Postgres \
            -s src/AcademicTopicSelectionService.API \
            --no-build --configuration Release -- --provider Postgres
          dotnet ef migrations has-pending-model-changes \
            -p src/AcademicTopicSelectionService.Migrations.SqlServer \
            -s src/AcademicTopicSelectionService.API \
            --no-build --configuration Release -- --provider SqlServer

      - name: Unit tests
        run: >
          dotnet test backend/tests/AcademicTopicSelectionService.UnitTests/AcademicTopicSelectionService.UnitTests.csproj
          --no-build -c Release
          --logger "console;verbosity=normal"

      - name: Integration tests (PostgreSQL)
        env:
          # Отключаем Ryuk-контейнер для очистки ресурсов: на CI он может вызывать
          # нестабильность из-за ограничений прав на Docker socket.
          TESTCONTAINERS_RYUK_DISABLED: "true"
          TEST_DB_PROVIDER: Postgres
        run: >
          dotnet test backend/tests/AcademicTopicSelectionService.IntegrationTests/AcademicTopicSelectionService.IntegrationTests.csproj
          --no-build -c Release
          --logger "console;verbosity=normal"

      - name: Integration tests (SQL Server)
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
          TEST_DB_PROVIDER: SqlServer
        run: >
          dotnet test backend/tests/AcademicTopicSelectionService.IntegrationTests/AcademicTopicSelectionService.IntegrationTests.csproj
          --no-build -c Release
          --logger "console;verbosity=normal"

  build-and-test-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Unit tests
        run: npx ng test --no-watch --browsers=ChromeHeadless
        working-directory: frontend
